# Entorno local: PostgreSQL, almacenamiento de archivos compatible S3 y correo de pruebas.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
      POSTGRES_DB: cmms
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cmms']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cmms
      MINIO_ROOT_PASSWORD: cmms-dev-only
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['8025:8025', '1025:1025']

volumes:
  pgdata:
  minio:
